[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reachability-guided-aerial-perception"
version = "0.1.0"
description = "Validated, ROS-independent manipulation interest fields"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=2,<3",
    "matplotlib>=3.10,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
